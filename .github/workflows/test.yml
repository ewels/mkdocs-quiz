name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ruff, prettier, mypy and the translation check all run from prek.toml, so
  # CI and the local git hooks cannot disagree about versions or arguments.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The check-translations hook is `language: system`, so it needs the
      # package importable in the same environment prek runs in.
      - run: pip install -e ".[dev]"

      - run: prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # --no-livereload: every page mkdocs serves otherwise carries a livereload
      # script that long-polls the server, and those requests pile up across a
      # browser-test run until a navigation times out.
      - name: Start MkDocs server
        run: |
          mkdocs serve --no-livereload --dev-addr 127.0.0.1:8765 &
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8765/mkdocs-quiz/ && break
            sleep 1
          done
          # Fail here rather than as 30 confusing test errors if it never came up.
          curl -sf -o /dev/null http://127.0.0.1:8765/mkdocs-quiz/

      - name: Test with pytest
        run: |
          pytest tests/ -v --cov=mkdocs_quiz --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.python-version }}
          path: tests/screenshots/
          retention-days: 7

  # Material and MaterialX install the same Python package, so test them in separate environments.
  test-materialx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install MaterialX test environment
        run: |
          python -m pip install --upgrade pip
          pip install -e . mkdocs-materialx

      - name: Build with MaterialX and ProperDocs
        run: |
          properdocs build --config-file mkdocs-materialx.yml
          python - <<'PY'
          from pathlib import Path

          index = Path("site/index.html").read_text()
          assert 'class="quiz"' in index
          assert 'id="quiz-progress-sidebar"' in index
          PY

  # Test that the built wheel installs correctly and entry points work
  # This catches issues where subpackages aren't included in the distribution
  test-wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from wheel (not editable)
        run: |
          # Create a fresh virtual environment to test the wheel
          python -m venv test-env
          source test-env/bin/activate
          # Install the built wheel (not editable mode)
          pip install dist/*.whl

      - name: Test CLI entry points
        run: |
          source test-env/bin/activate
          # Test that the entry points work
          mkdocs-quiz --version
          quiz --version
          mkdocs-quiz --help
          quiz run --help
          quiz translations --help
          quiz export --help
          # Locale files must be packaged; this fails if package-data misses them
          quiz translations check

      - name: Test Python imports
        run: |
          source test-env/bin/activate
          # Test that all subpackages are importable
          python -c "from mkdocs_quiz.cli import main; print('CLI import OK')"
          python -c "from mkdocs_quiz.qti import QTIExporter; print('QTI import OK')"
          python -c "from mkdocs_quiz.plugin import MkDocsQuizPlugin; print('Plugin import OK')"
          python -c "from mkdocs_quiz.translations import TranslationManager; print('Translations import OK')"
