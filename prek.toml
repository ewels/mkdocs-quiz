# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.12"

# Pin `rev` to commit hashes on `prek update`, so a moved tag cannot change
# what the hooks run.
[update]
freeze = true

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  {
    id = "check-yaml",
    args = ["--unsafe"]
  },
  {
    id = "check-added-large-files",
    args = ["--maxkb=1000"]
  },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "debug-statements" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "321478e58f4938179c6b86e4ddfa923d1547a49b"  # frozen: v0.16.6
# ruff 0.16 formats Python blocks inside Markdown too, which fights prettier
# over the same files. Keep ruff on Python and leave Markdown to prettier.
hooks = [
  {
    id = "ruff-check",
    args = ["--fix"],
    types_or = ["python", "pyi", "jupyter"]
  },
  {
    id = "ruff-format",
    types_or = ["python", "pyi", "jupyter"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "f12edd9c7be1c20cfa42420fd0e6df71e42b51ea"  # frozen: v4.0.0-alpha.8
hooks = [
  {
    id = "prettier",
    types_or = [
      "javascript",
      "css",
      "json",
      "yaml",
      "markdown"
    ]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "7ff8d35ae36a7d2b968f2f90b4c723e292e594ee"  # frozen: v2.3.1
hooks = [
  {
    id = "mypy",
    additional_dependencies = [
      "types-PyYAML",
      "types-Markdown",
      "types-polib>=1.0.0",
      "mkdocs>=1.4.0,<2",
      "polib>=1.1.0",
      "babel>=2.9.0"
    ],
    args = ["--ignore-missing-imports"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "check-translations",
    name = "Check translation completeness",
    entry = "python -m mkdocs_quiz.cli translations check",
    # Runs against the checkout itself (`pip install -e ".[dev]"`) so that the
    # locale files being committed are the ones checked. An isolated hook env
    # would validate a stale copy of them instead.
    language = "system",
    pass_filenames = false,
    files = '\.(po|pot)$'
  }
]
